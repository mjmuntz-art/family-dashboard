<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, initial-scale=1, user-scalable=no">
<title>Muntz Family Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fonts" rel="stylesheet" href="">
<script>(function () { var l = document.createElement("link"); l.rel = "stylesheet"; l.href = "style.css?t=" + Date.now(); document.head.appendChild(l); })();</script>
</head>
<body>
<div id="stage">
  <div id="scene"></div>

  <div id="topbar">
    <div class="clock frost">
      <div class="t"><span id="time">--:--</span><span class="ap" id="ampm"></span></div>
      <div style="display:flex;flex-direction:column;padding-bottom:4px">
        <div id="dow" style="font-size:18px;font-weight:700"></div>
        <div id="date" class="muted" style="font-size:15px"></div>
      </div>
    </div>
    <div class="banner frost">
      <div id="btitle" class="title head"></div>
      <div id="bsub" class="sub"></div>
    </div>
    <button type="button" class="tap wxpill frost" data-go="weather" aria-label="Open weather">
      <span id="wxicon"></span>
      <span style="display:flex;flex-direction:column;align-items:flex-end">
        <span id="wxtemp" class="temp">--°</span>
        <span id="wxsub" class="muted" style="font-size:14px">&nbsp;</span>
      </span>
    </button>
  </div>

  <div id="alert" role="alert"></div>
  <div id="screen"></div>
  <div id="nav"><div class="bar frost" id="navbar"></div></div>
  <div id="overlay"><div class="card" id="card"></div></div>
  <div id="demo"></div>

  <div id="start">
    <button type="button" id="startbtn">Tap to start full screen</button>
  </div>
  <video id="keepalive" src="keepalive.mp4" muted loop playsinline autoplay></video>
</div>

<script>
// Load the dashboard files fresh every time so the Echo never runs an old copy
(function () {
  var t = Date.now(), files = ['config.js', 'themes.js', 'scenes.js', 'app.js'];
  (function next(i) { if (i >= files.length) return; var s = document.createElement('script'); s.src = files[i] + '?t=' + t; s.onload = function () { next(i + 1); }; document.body.appendChild(s); })(0);
})();
</script>
</body>
</html>
