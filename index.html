<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, initial-scale=1, user-scalable=no">
<title>Muntz Family Dashboard</title>
<!-- This outer page holds full screen. The dashboard runs inside it (dash.html) and reloads on its own
     when GitHub changes, so updates never knock the screen out of full screen. -->
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #dash { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
</style>
</head>
<body>
<iframe id="dash" title="Muntz Family Dashboard" allow="fullscreen; autoplay; screen-wake-lock"></iframe>
<script>
(function () {
  var f = document.getElementById('dash'), q = location.search;
  f.src = 'dash.html' + q + (q ? '&' : '?') + 'shell=1';
  f.addEventListener('load', function () { try { f.contentWindow.focus(); } catch (e) { /* ignore */ } });
  // TV remote presses land here sometimes: pass them on so they count as "start"
  document.addEventListener('keydown', function () { try { if (f.contentWindow.dashStart) f.contentWindow.dashStart(); } catch (e) { /* ignore */ } });
  document.addEventListener('click', function () { try { if (f.contentWindow.dashStart) f.contentWindow.dashStart(); } catch (e) { /* ignore */ } });
  // if this outer page itself ever changes on GitHub, reload everything (rare)
  var print = null;
  setInterval(function () {
    fetch('index.html?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : null; }).then(function (t) {
      if (!t) return; if (print && t !== print) location.reload(); print = print || t;
    }).catch(function () { /* offline */ });
  }, 5 * 60000);
})();
</script>
</body>
</html>
